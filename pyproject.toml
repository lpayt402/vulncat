[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vulnerability-workbench"
version = "0.1.0"
description = "Vulncat — Vulnerability Concatenator: offline vulnerability signal reconciliation and service exposure reporting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=25,<26",
  "defusedxml>=0.7,<1",
  "email-validator>=2.2,<3",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "orjson>=3.10,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0.41,<2.1",
  "uvicorn[standard]>=0.35,<1",
  "xlsxwriter>=3.2,<4",
]

[project.optional-dependencies]
mcp = ["mcp>=1.30,<2"]
dev = [
  "mypy>=1.16,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "pytest-xdist>=3.8,<4",
  "ruff>=0.12,<1",
  "types-passlib>=1.7.7.20250602",
]

[project.scripts]
vulnerability-workbench = "vulnbatch.cli:main"
vulncat = "vulnbatch.cli:main"
vulncat-mcp = "vulnbatch.mcp_server:main"
vulncat-worker = "vulnbatch.worker:main"
vulnerability-workbench-mcp = "vulnbatch.mcp_server:main"
vulnerability-workbench-worker = "vulnbatch.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/vulnbatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: requires PostgreSQL",
  "load: synthetic performance validation",
]

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["B008", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "backend"
exclude = ["alembic"]
