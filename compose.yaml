name: vulnerability-workbench

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile
  target: runtime

x-app-environment: &app-environment
  APP_NAME: Vulncat
  APP_VERSION: ${APP_VERSION:-0.1.0}
  ENVIRONMENT: ${ENVIRONMENT:-production}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-workbench}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-workbench}"
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8787}
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
  SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-vulnerability_workbench_session}
  SESSION_TIMEOUT_MINUTES: ${SESSION_TIMEOUT_MINUTES:-480}
  SECURE_COOKIES: ${SECURE_COOKIES:-false}
  UPLOAD_DIR: /data/uploads
  REPORT_DIR: /data/reports
  STATIC_DIR: /app/static
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-536870912}
  TRACKED_SEVERITIES: ${TRACKED_SEVERITIES:-medium,low}
  IP_ASSOCIATION_STALENESS_DAYS: ${IP_ASSOCIATION_STALENESS_DAYS:-90}
  IDENTITY_AUTO_MATCH_THRESHOLD: ${IDENTITY_AUTO_MATCH_THRESHOLD:-0.85}
  MATURITY_GATE_DAYS: ${MATURITY_GATE_DAYS:-30}
  MEDIUM_SLA_DAYS: ${MEDIUM_SLA_DAYS:-60}
  LOW_SLA_DAYS: ${LOW_SLA_DAYS:-90}
  ALLOW_FINDING_DATE_MATURITY_FALLBACK: ${ALLOW_FINDING_DATE_MATURITY_FALLBACK:-false}
  LARGE_EXPORT_FINDING_THRESHOLD: ${LARGE_EXPORT_FINDING_THRESHOLD:-10000}
  EXPORT_RETENTION_DAYS: ${EXPORT_RETENTION_DAYS:-30}
  UPLOAD_RETENTION_DAYS: ${UPLOAD_RETENTION_DAYS:-}
  IMPORT_EVIDENCE_RETENTION_DAYS: ${IMPORT_EVIDENCE_RETENTION_DAYS:-}
  AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-}
  WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-1.0}
  WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-300}
  LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
  LOGIN_WINDOW_MINUTES: ${LOGIN_WINDOW_MINUTES:-15}
  DB_STARTUP_TIMEOUT_SECONDS: ${DB_STARTUP_TIMEOUT_SECONDS:-90}

x-app-service: &app-service
  image: ${VULNERABILITY_WORKBENCH_IMAGE:-vulnerability-workbench:local}
  build: *app-build
  environment: *app-environment
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  volumes:
    - uploads:/data/uploads
    - reports:/data/reports
  restart: unless-stopped

services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workbench}
      POSTGRES_USER: ${POSTGRES_USER:-workbench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:---auth-host=scram-sha-256}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - "${BACKUP_DIR:-./backups}:/backups"
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready --username="$${POSTGRES_USER}" --dbname="$${POSTGRES_DB}"'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: ${DB_CPU_LIMIT:-2.0}
          memory: ${DB_MEMORY_LIMIT:-2G}
          pids: ${DB_PIDS_LIMIT:-256}

  web:
    <<: *app-service
    entrypoint:
      - /app/scripts/docker-entrypoint.sh
    environment:
      <<: *app-environment
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${VULNERABILITY_WORKBENCH_BIND_ADDRESS:-127.0.0.1}:${VULNERABILITY_WORKBENCH_PORT:-8787}:8787"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8787/readyz', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: ${WEB_CPU_LIMIT:-1.0}
          memory: ${WEB_MEMORY_LIMIT:-1G}
          pids: ${WEB_PIDS_LIMIT:-256}

  worker:
    <<: *app-service
    entrypoint:
      - /app/scripts/worker-entrypoint.sh
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "kill -0 1"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 90s
    deploy:
      resources:
        limits:
          cpus: ${WORKER_CPU_LIMIT:-2.0}
          memory: ${WORKER_MEMORY_LIMIT:-2G}
          pids: ${WORKER_PIDS_LIMIT:-256}

volumes:
  postgres_data:
  uploads:
  reports:
