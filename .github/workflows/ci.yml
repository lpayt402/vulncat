name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install '.[dev,mcp]'
      - run: python -m pytest -q
      - run: python -m ruff check backend tests scripts/validation examples
      - run: python -m mypy backend
      - run: python examples/cedar-ridge/validate.py
        env:
          PYTHONPATH: backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag vulnerability-workbench:ci .

  postgres-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vwb_test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: vwb_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U vwb_test -d vwb_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://vwb_test:disposable_ci_only@127.0.0.1:5432/vwb_test
      VWB_TEST_DATABASE_URL: postgresql+psycopg://vwb_test:disposable_ci_only@127.0.0.1:5432/vwb_test
      SECRET_KEY: synthetic-disposable-ci-secret-0000000000000000
      STATIC_DIR: frontend/dist
      UPLOAD_DIR: output/qa/uploads
      REPORT_DIR: output/qa/reports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install '.[dev,mcp]' playwright==1.63.0
      - run: python -m pytest tests/integration -q
      - run: npm ci && npm run build
        working-directory: frontend
      - run: python -m playwright install --with-deps chromium
      - run: python -m alembic upgrade head
      - run: python scripts/validation/browser_reconciliation.py
        env:
          VWB_BROWSER_QA: "1"
      - run: python scripts/validation/service_interfaces.py
        env:
          VWB_SERVICE_QA: "1"
      - run: python scripts/validation/restore_persistence.py
        env:
          VWB_RESTORE_QA: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persistence-browser-qa
          path: |
            output/playwright/workflow-trace.zip
            output/playwright/evidence-workflow.png
            output/playwright/failure.png
            output/playwright/server.log
            output/playwright/synthetic.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: service-interface-qa
          path: |
            output/playwright/service*
            output/playwright/exposure-page.json
          retention-days: 7
